# sops recipients. Every secrets file is encrypted to the admin key (so you
# can edit it) and to each host that needs to decrypt it.
#
#   admin key:  age-keygen -o ~/.config/sops/age/keys.txt   (prints the public key)
#   host key:   ssh-keyscan -t ed25519 holodeck | ssh-to-age
#               (or on the host: ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub)
#
# After changing recipients, re-encrypt: sops updatekeys secrets/<file>.yaml
keys:
  - &nathan age15qv6c5xfphfdehhqdrsz4ls3u7ry9uy00cqeq259u7x04xvyzq4sp2t0lj
  - &holodeck age1REPLACE_WITH_HOLODECK_HOST_KEY
creation_rules:
  - path_regex: secrets/mediaserver\.yaml$
    key_groups:
      - age:
          - *nathan
          - *holodeck
